<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic Wheel</title>

<style>
body {
    font-family: Arial;
    background: #0f0f0f;
    color: white;
    text-align: center;
    padding: 20px;
}

h1 { color: #ff4444; }

#wheel {
    font-size: 120px;
    margin: 20px;
    transition: transform 1.5s ease;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    background: #ff4444;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.card {
    background: #1a1a1a;
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    text-align: left;
}
</style>
</head>

<body>

<h1>🎡 Topic Wheel</h1>

<div id="wheel">🎡</div>

<button onclick="spin()">SPIN</button>

<div id="result" class="card"></div>

<!-- SIMPLE FINAL OUTPUT -->
<div id="liveBoard" class="card"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCG4_WuIMWSaR58bA_0P_CA1jfv8ts480o",
authDomain: "topic-roulette-7de50.firebaseapp.com",
projectId: "topic-roulette-7de50",
storageBucket: "topic-roulette-7de50.firebasestorage.app",
messagingSenderId: "852683467119",
appId: "1:852683467119:web:791b957650a181643a209a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const stateRef = doc(db, "game", "state");

// 🎯 FIXED TOPICS
const assignments = {
  "Person 1": [1, 2, 5],
  "Person 2": [8, 3, 6],
  "Person 3": [11, 4, 14],
  "Person 4": [12, 7, 15],
  "Person 5": [21, 9, 17],
  "Person 6": [13, 10, 18],
  "Person 7": [16, 20, 19]
};

// 🔥 INIT ONCE
async function initGame() {
    const snap = await getDoc(stateRef);

    if (!snap.exists()) {
        const people = Object.keys(assignments);

        for (let i = people.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [people[i], people[j]] = [people[j], people[i]];
        }

        await setDoc(stateRef, {
            order: people,
            index: 0
        });
    }
}

await initGame();

// 🎡 SPIN
window.spin = async function () {

    const wheel = document.getElementById("wheel");
    wheel.style.transform = "rotate(1080deg)";

    setTimeout(async () => {

        const snap = await getDoc(stateRef);
        const data = snap.data();

        if (data.index >= data.order.length) {
            alert("All assigned!");
            return;
        }

        const person = data.order[data.index];

        await updateDoc(stateRef, {
            index: data.index + 1
        });

        document.getElementById("result").innerHTML = `
            <h2>🎉 ${person}</h2>
            <p>Topics: ${assignments[person].join(", ")}</p>
        `;

        wheel.style.transform = "rotate(0deg)";

    }, 1500);
};

// 📜 SIMPLE FINAL LIST (THIS IS THE ONLY THING YOU WANTED)
function render() {
    getDoc(stateRef).then(snap => {
        const data = snap.data();
        if (!data) return;

        let html = "<h3>📜 FINAL RESULTS</h3>";

        for (let i = 0; i < data.index; i++) {
            const person = data.order[i];
            html += `<p>${person} got: ${assignments[person].join(", ")}</p>`;
        }

        document.getElementById("liveBoard").innerHTML = html;
    });
}

// refresh every spin
setInterval(render, 1000);

</script>

</body>
</html>
