<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin the Wheel Assignment</title>

<style>
body {
    font-family: Arial;
    background: #0f0f0f;
    color: white;
    text-align: center;
    padding: 20px;
}

h1 {
    color: #ff4444;
}

#wheel {
    font-size: 120px;
    margin: 20px;
    transition: transform 2s ease;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    background: #ff4444;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.card {
    background: #1a1a1a;
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
}
</style>
</head>

<body>

<h1>🎡 Spin the Wheel</h1>

<div id="wheel">🎡</div>

<button onclick="spin()">SPIN</button>

<div id="result" class="card"></div>
<div id="board" class="card"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCG4_WuIMWSaR58bA_0P_CA1jfv8ts480o",
authDomain: "topic-roulette-7de50.firebaseapp.com",
projectId: "topic-roulette-7de50",
storageBucket: "topic-roulette-7de50.firebasestorage.app",
messagingSenderId: "852683467119",
appId: "1:852683467119:web:791b957650a181643a209a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 👥 Names list
const people = [
"Person 1","Person 2","Person 3","Person 4","Person 5","Person 6","Person 7"
];

// 📦 same assignments as before
const assignments = {
  1: {easy:{num:1,name:"PCs & Peripherals"},medium:{num:2,name:"Power & Cooling"},hard:{num:5,name:"TCP/IP & Ports"}},
  2: {easy:{num:8,name:"Mobile Setup"},medium:{num:3,name:"BIOS/UEFI"},hard:{num:6,name:"Network Troubleshooting"}},
  3: {easy:{num:11,name:"Windows Interfaces"},medium:{num:4,name:"Cabling & Wireless"},hard:{num:14,name:"IP Troubleshooting"}},
  4: {easy:{num:12,name:"OS & Email"},medium:{num:7,name:"Cloud Computing"},hard:{num:15,name:"IAM & Encryption"}},
  5: {easy:{num:21,name:"Change Management"},medium:{num:9,name:"Printers"},hard:{num:17,name:"Linux CLI"}},
  6: {easy:{num:13,name:"Windows Tools"},medium:{num:10,name:"Linux Basics"},hard:{num:18,name:"DoS & Vulnerabilities"}},
  7: {easy:{num:16,name:"OS Upgrades"},medium:{num:20,name:"Mobile Security"},hard:{num:19,name:"Malware"}}
};

let available = [...people];

// 🎡 SPIN FUNCTION
window.spin = async function () {

  if (available.length === 0) {
    alert("All people already assigned!");
    return;
  }

  const wheel = document.getElementById("wheel");
  wheel.style.transform = "rotate(1080deg)";

  setTimeout(async () => {

    const index = Math.floor(Math.random() * available.length);
    const chosen = available.splice(index, 1)[0];

    // assign hidden number (1–7)
    const number = people.indexOf(chosen) + 1;

    await setDoc(doc(db, "claims", number.toString()), {
      name: chosen,
      number: number,
      time: Date.now()
    });

    const a = assignments[number];

    document.getElementById("result").innerHTML = `
      <h2>🎉 ${chosen}</h2>

      <h3>Easy</h3>
      <p>Topic ${a.easy.num}: ${a.easy.name}</p>

      <h3>Medium</h3>
      <p>Topic ${a.medium.num}: ${a.medium.name}</p>

      <h3>Hard</h3>
      <p>Topic ${a.hard.num}: ${a.hard.name}</p>
    `;

    wheel.style.transform = "rotate(0deg)";
  }, 2000);
};

// 📋 LIVE BOARD
const board = document.getElementById("board");

onSnapshot(collection(db, "claims"), (snapshot) => {

  let html = "<h3>📋 ASSIGNED</h3>";

  snapshot.forEach(doc => {
    const d = doc.data();
    html += `<p>✔ ${d.name} → ${d.number}</p>`;
  });

  board.innerHTML = html;
});

</script>

</body>
</html>
